<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ibb Commercial Data</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#171717}main{max-width:900px;margin:0 auto;padding:28px}.card{background:#fff;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #0000000c}a{display:inline-block;margin:6px 8px 6px 0;padding:10px 14px;border-radius:10px;background:#171717;color:#fff;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{font-size:28px;font-weight:700}.label{font-size:13px;color:#666}</style></head><body><main><div class="card"><h1>بيانات المحلات والأنشطة التجارية في إب</h1><p>هذه الواجهة مخصصة للبيانات، وليست خريطة. Render ينفذ عملية الجمع، وGitHub يسحب ملفات النتائج بعد اكتمال المسح.</p></div><div id="stats" class="card">جارٍ تحميل التقرير...</div><div class="card"><h2>ملفات البيانات</h2><a href="/data/ibb_places.csv">CSV</a><a href="/data/ibb_places.jsonl">JSONL</a><a href="/data/coverage_report.json">Coverage Report</a></div><script>fetch('/data/coverage_report.json').then(r=>r.json()).then(x=>{let g=x.google||{};document.getElementById('stats').innerHTML='<div class="grid"><div><div class="stat">'+(x.unique_count??0)+'</div><div class="label">سجل موحد</div></div><div><div class="stat">'+(x.google_count_raw??0)+'</div><div class="label">نتائج Google الخام</div></div><div><div class="stat">'+(x.osm_count??0)+'</div><div class="label">نتائج OSM</div></div><div><div class="stat">'+(x.matched_multi_source_count??0)+'</div><div class="label">مطابقة المصدرين</div></div></div><p>Google: '+(g.available?'متاح':'غير متاح')+' — آخر تحديث: '+(x.generated_at||'')+'</p>'}).catch(()=>document.getElementById('stats').textContent='لم يتم نشر نتيجة مسح جديدة بعد.');</script></main></body></html>
