name: Ibb Google Maps Browser Coverage

concurrency:
  group: ibb-google-maps-browser
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "config/ibb_maps_queries.yml"
      - "scripts/ibb_maps_browser_scan.py"
      - "scripts/merge_browser_results.py"
      - ".github/workflows/ibb-maps-browser.yml"
  workflow_dispatch:
  schedule:
    - cron: "47 1 * * *"

permissions:
  contents: write

jobs:
  discover:
    name: Discover shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4

      - name: Validate scanner syntax
        run: |
          python -m py_compile scripts/ibb_maps_browser_scan.py
          grep -q "discover_only: bool = False" scripts/ibb_maps_browser_scan.py

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.48,<2" PyYAML
          python -m playwright install --with-deps chromium

      - name: Run area/category discovery
        run: |
          mkdir -p .scan/google_maps_browser
          python scripts/ibb_maps_browser_scan.py             --config config/ibb_maps_queries.yml             --shard ${{ matrix.shard }}             --shards 8             --discover-only             --output-dir .scan/google_maps_browser

      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-maps-browser-shard-${{ matrix.shard }}
          path: |
            .scan/google_maps_browser/shard_${{ matrix.shard }}.jsonl
            .scan/google_maps_browser/shard_${{ matrix.shard }}.state.json
          if-no-files-found: warn
          retention-days: 7

  merge:
    name: Merge all discovered places
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: google-maps-browser-shard-*
          path: .scan/google_maps_browser
          merge-multiple: true

      - name: Merge and audit
        run: python scripts/merge_browser_results.py

      - name: Validate outputs
        run: |
          test -s data/google_maps_browser_results.jsonl
          test -s data/google_maps_browser_results.csv
          test -s data/google_maps_browser_report.json
          python - <<'PY'
          import json
          p=json.load(open("data/google_maps_browser_report.json",encoding="utf-8"))
          assert p["unique_records"] > 0, p
          assert p["with_coordinates"] > 0 or p["with_place_id"] > 0, p
          print(json.dumps(p,ensure_ascii=False,indent=2))
          PY

      - name: Commit results
        run: |
          set -e
          git config user.name "Spatial Synapse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/google_maps_browser_results.jsonl data/google_maps_browser_results.csv data/google_maps_browser_report.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Google Maps browser coverage"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
