name: Ibb Places Coverage Scan

concurrency:
  group: ibb-places-scan-main
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - ".scan/**"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RENDER_DATA_BASE: https://spatial-synapse-ibb-map.onrender.com/data
    steps:
      - uses: actions/checkout@v4

      - name: Trigger fresh Render scan
        run: |
          mkdir -p .scan
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .scan/heartbeat.txt
          git config user.name "Spatial Synapse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .scan/heartbeat.txt
          git diff --cached --quiet || git commit -m "ci: trigger fresh Render Ibb scan"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Wait for Render scan result
        run: |
          set -e
          python - <<'PY'
          import json, time, urllib.request
          base="https://spatial-synapse-ibb-map.onrender.com/data"
          url=f"{base}/coverage_report.json"
          deadline=time.time()+80*60
          last=None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data=json.load(r)
                  generated=data.get("generated_at","")
                  google=data.get("google",{})
                  last=(generated, google.get("available"), data.get("unique_count"))
                  print("Render:", last)
                  if generated and google.get("available") is True and data.get("google_count_raw",0) > 0:
                      break
              except Exception as exc:
                  print("waiting:", exc)
              time.sleep(20)
          else:
              raise SystemExit(f"Render scan did not publish a Google-enabled result: {last}")
          PY

      - name: Download Render results
        run: |
          set -e
          mkdir -p data
          curl -fL --retry 5 --retry-delay 3 "$RENDER_DATA_BASE/ibb_places.jsonl" -o data/ibb_places.jsonl
          curl -fL --retry 5 --retry-delay 3 "$RENDER_DATA_BASE/ibb_places.csv" -o data/ibb_places.csv
          curl -fL --retry 5 --retry-delay 3 "$RENDER_DATA_BASE/coverage_report.json" -o data/coverage_report.json

      - name: Save results
        run: |
          set -e
          git config user.name "Spatial Synapse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh Ibb places coverage"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
