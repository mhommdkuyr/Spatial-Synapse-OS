name: Ibb Places Coverage Scan

concurrency:
  group: ibb-places-scan-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
  schedule:
    # Continuous hourly refresh without flooding the repository with commits.
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Scan Ibb
        run: python scripts/ibb_scan.py --config config/ibb.yml
      - name: Save results
        run: |
          git config user.name "Spatial Synapse Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh Ibb places coverage"
          git push
