services:
  - type: web
    name: spatial-synapse-ibb-map
    runtime: static
    repo: https://github.com/mhommdkuyr/Spatial-Synapse-OS
    branch: main
    buildCommand: pip install -r requirements.txt && python scripts/ibb_scan.py --config config/ibb_render.yml
    staticPublishPath: public
    autoDeploy: true
    envVars:
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: SCAN_DEPLOY_NONCE
        sync: false
